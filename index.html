<title>レベル合わせるぞい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 上に題名と階段状の学年ボタン、中央におすすめ(背表紙つきの一覧)、
   下は全幅の「6階の本棚」。本は縦書きの背表紙で、棚の段が難易度、色が読みやすさ。 */
:root {
  --ground: #e9ecea;
  --paper: #f6f7f5;
  --ink: #1b2a31;
  --ink-2: #4b5c63;
  --rule: #c3cbc9;
  --green: #1f5a4c;
  --green-ink: #f1f5f2;
  --green-soft: #cfe0d9;
  --ochre: #d6a63a;
  --ochre-ink: #1b2a31;
  --mist: #cdd5d7;
  --mist-ink: #2d3d44;
  --wood: #a98456;
  --wood-hi: #c4a173;
  --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "Noto Serif JP", serif;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141a1c; --paper: #1b2326; --ink: #e4ebe8; --ink-2: #9db0b0; --rule: #2f3b3e;
    --green: #2f7d6a; --green-ink: #f3f7f5; --green-soft: #1f3a33;
    --ochre: #c99a2e; --ochre-ink: #14191a; --mist: #2b3639; --mist-ink: #b4c2c3;
    --wood: #7d6140; --wood-hi: #957650;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141a1c; --paper: #1b2326; --ink: #e4ebe8; --ink-2: #9db0b0; --rule: #2f3b3e;
  --green: #2f7d6a; --green-ink: #f3f7f5; --green-soft: #1f3a33;
  --ochre: #c99a2e; --ochre-ink: #14191a; --mist: #2b3639; --mist-ink: #b4c2c3;
  --wood: #7d6140; --wood-hi: #957650;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.75; }
h1, h2, h3 { margin: 0; font-family: var(--serif); line-height: 1.35; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.wrap { width: 100%; max-width: 1040px; margin-inline: auto; padding-inline: 16px; }
.muted { color: var(--ink-2); }

/* 題名 */
.mast { padding-block: 40px 8px; display: grid; gap: 10px; }
.mast h1 { font-weight: 800; font-size: clamp(36px, 9vw, 64px); letter-spacing: .02em; line-height: 1.1; }
.mast p { color: var(--ink-2); max-width: 34em; }

main { display: grid; gap: 56px; padding-block: 28px 0; }
.block { display: grid; gap: 16px; min-width: 0; }
.block > h2 { font-size: 24px; font-weight: 700; }
.lead { color: var(--ink-2); font-size: 15px; max-width: 38em; }

/* 学年ボタン(階段) */
.stairs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: end; max-width: 640px; }
.step { display: grid; align-content: start; gap: 2px; text-align: left; padding: 12px 12px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 2px; min-width: 0; }
.step:nth-child(1) { min-height: 68px; }
.step:nth-child(2) { min-height: 88px; }
.step:nth-child(3) { min-height: 108px; }
.step:nth-child(4) { min-height: 128px; }
.step b { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.3; }
.step small { font-size: 12.5px; color: var(--ink-2); }
.step:hover { border-color: var(--ink); }
.step.done { background: var(--green-soft); border-color: var(--green-soft); }
.step.on { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.step.on small { color: var(--green-ink); }
.link { justify-self: start; background: none; border: 0; padding: 4px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; font-size: 14.5px; text-align: left; }
.link:hover { text-decoration-thickness: 2px; }
.years { display: grid; gap: 16px; padding-top: 4px; }
.years h3 { font-size: 15px; margin-bottom: 6px; color: var(--ink-2); font-family: var(--sans); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.course { background: var(--paper); border: 1.5px solid var(--rule); border-radius: 2px; padding: 4px 12px; font-size: 14px; min-height: 36px; line-height: 1.5; }
.course[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }

/* 分野 */
.cats { display: flex; flex-wrap: wrap; gap: 2px 18px; }
.cats button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 4px 0 2px; font-size: 15px; color: var(--ink-2); min-height: 36px; }
.cats button i { font-style: normal; font-size: 12.5px; margin-left: 4px; }
.cats button:hover { color: var(--ink); }
.cats button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }

/* おすすめ */
.recs-head { display: grid; gap: 4px; }
.recs-head h2 { font-size: 19px; font-weight: 700; }
.recs { display: grid; gap: 0 32px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.rec { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; text-align: left; padding: 18px 0 20px; background: none; border: 0; border-top: 1px solid var(--rule); width: 100%; }
.rec:hover .rec-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.rec-body { display: grid; gap: 6px; align-content: start; min-width: 0; }
.rec-title { font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1.45; }
.rec-meta { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.rec-why { font-size: 14.5px; line-height: 1.7; }
.empty { padding: 14px 16px; border: 1.5px dashed var(--rule); border-radius: 2px; color: var(--ink-2); font-size: 15px; }

/* 背表紙(おすすめ用の小さいもの) */
.mini { width: 44px; height: 116px; border-radius: 2px 2px 0 0; display: flex; justify-content: center; padding-top: 12px; position: relative; }
.mini span { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 700; font-size: 16px; letter-spacing: .12em; line-height: 1; }

/* 状態の色 */
.s-ready { background: var(--green); color: var(--green-ink); }
.s-near { background: var(--ochre); color: var(--ochre-ink); }
.s-prep { background: var(--mist); color: var(--mist-ink); box-shadow: inset 0 0 0 1px var(--rule); }

/* 本棚(全幅の帯) */
.cabinet { background: var(--paper); border-bottom: 1px solid var(--rule); padding-block: 32px 64px; min-height: 70vh; }
.cabinet .wrap { display: grid; gap: 28px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 22px; border-radius: 1px 1px 0 0; display: inline-block; }
.shelf { display: grid; gap: 8px; }
.shelf-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.shelf-head h2 { font-size: 22px; font-weight: 800; }
.shelf-head p { font-size: 14px; color: var(--ink-2); }
.rack { --rowh: 282px; display: grid; grid-template-columns: repeat(auto-fill, 46px); justify-content: start; gap: 0 7px; grid-auto-rows: var(--rowh); align-items: end; padding-inline: 6px;
  background-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--rowh) - 10px), var(--wood-hi) calc(var(--rowh) - 10px), var(--wood-hi) calc(var(--rowh) - 8px), var(--wood) calc(var(--rowh) - 8px), var(--wood) var(--rowh));
  background-size: 100% var(--rowh); background-repeat: repeat-y; }
.spine { width: 46px; height: 260px; margin-bottom: 10px; border: 0; border-radius: 2px 2px 0 0; padding: 16px 0 0; display: flex; justify-content: center; align-items: flex-start; position: relative; }
.spine::before, .spine::after { content: ""; position: absolute; left: 5px; right: 5px; height: 2px; background: currentColor; opacity: .28; }
.spine::before { top: 7px; }
.spine::after { bottom: 8px; }
.spine span { writing-mode: vertical-rl; text-orientation: mixed; font-family: var(--serif); font-weight: 700; font-size: 13.5px; letter-spacing: .04em; line-height: 1.2; white-space: nowrap; max-height: calc(100% - 30px); overflow: hidden; text-overflow: ellipsis; }
.spine:hover, .spine:focus-visible { transform: translateY(-8px); }
.spine.on { transform: translateY(-8px); outline: 3px solid var(--ink); outline-offset: 2px; }

/* 画面の切り替え: 上(広い画面)または下(スマホ)のタブ */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.brand { background: none; border: 0; padding: 0; font-family: var(--serif); font-weight: 800; font-size: 18px; letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 12px; min-height: 44px; font-size: 15px; color: var(--ink-2); }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--green); }
#screen { min-height: 70vh; }
.page { padding-block: 28px 56px; display: grid; gap: 28px; min-width: 0; }
.page-h { font-size: clamp(28px, 6vw, 38px); font-weight: 800; letter-spacing: .01em; }
.ttl:focus { outline: none; }
.now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 15px; color: var(--ink-2); margin-top: 6px; }
.now b { color: var(--ink); }
.now .link { font-size: 14.5px; }
.go { justify-self: start; display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 32px; background: var(--green); color: var(--green-ink); border: 2px solid var(--green); border-radius: 2px; font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: .04em; }
.go:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.go.alt { background: none; color: var(--ink); border-color: var(--ink); }
.go.alt:hover { background: var(--ink); color: var(--paper); }
.link.inline { display: inline; padding: 0; font-size: inherit; text-align: left; }

/* 本の詳細(1画面) */
.detail { max-width: 760px; }
.detail-head { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; align-items: start; }
.detail-head h1 { font-size: clamp(24px, 5vw, 32px); font-weight: 800; line-height: 1.4; }
.by { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 2px; background: var(--mist); color: var(--mist-ink); }
.detail section { display: grid; gap: 6px; }
.detail h3 { font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--ink-2); }
.concepts { display: flex; flex-wrap: wrap; gap: 6px; }
.concepts span { background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 0 10px; font-size: 14px; line-height: 1.8; }
.ok-line { font-weight: 700; color: var(--green); }
:root[data-theme="dark"] .ok-line { color: var(--green-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ok-line { color: var(--green-ink); } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 15px; }
.steps .k { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.steps .goal b { font-family: var(--serif); font-size: 17px; }
.small { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }

/* 下の説明 */
.about { padding-block: 40px 56px; display: grid; gap: 12px; }
.about summary { cursor: pointer; font-family: var(--serif); font-size: 19px; font-weight: 700; }
.about-in { display: grid; gap: 12px; padding-top: 12px; max-width: 42em; font-size: 15px; }
.about-in p { color: var(--ink-2); }
.btn { justify-self: start; background: none; border: 1.5px solid var(--ink); border-radius: 2px; padding: 6px 16px; font-weight: 700; font-size: 14px; min-height: 40px; }
.btn:hover { background: var(--ink); color: var(--paper); }
footer { border-top: 1px solid var(--rule); padding-block: 18px 36px; font-size: 13px; color: var(--ink-2); }

@media (min-width: 720px) {
  .years { grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .mast { padding-block: 64px 12px; }
}
@media (max-width: 719px) {
  #app { padding-bottom: 64px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; gap: 0; background: var(--paper); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs button { flex: 1; border-bottom: 0; border-top: 3px solid transparent; padding-inline: 4px; font-size: 14.5px; }
  .tabs button[aria-current="page"] { border-top-color: var(--green); }
  .go { width: 100%; justify-self: stretch; }
}
@media (max-width: 420px) {
  .step { padding: 10px 8px; }
  .step b { font-size: 15.5px; }
}
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: no-preference) {
  #screen.enter { animation: enter .2s ease-out; }
  .spine { transition: transform .15s ease-out; }
  .step, .course, .cats button { transition: background-color .15s, border-color .15s, color .15s; }
}

</style>

/* レベル合わせるぞい: 判定ロジック(画面に依存しない関数だけ) */
(function (root) {
  'use strict';

  function build(D) {
    var concepts = D.concepts, books = D.books, courses = D.courses;
    var cmap = new Map(concepts.map(function (c) { return [c.id, c]; }));
    var bmap = new Map(books.map(function (b) { return [b.id, b]; }));
    var byTitle = new Map(books.map(function (b) { return [b.title, b]; }));

    // 概念 id とその前提すべて(自分を含む)
    var upCache = new Map();
    function up(id) {
      if (upCache.has(id)) return upCache.get(id);
      var s = new Set([id]);
      upCache.set(id, s); // 循環があっても止まるように先に登録
      var c = cmap.get(id);
      if (c) c.requires.forEach(function (r) { up(r).forEach(function (x) { s.add(x); }); });
      return s;
    }
    function upAll(ids) {
      var s = new Set();
      ids.forEach(function (i) { up(i).forEach(function (x) { s.add(x); }); });
      return s;
    }

    var depthCache = new Map();
    function depth(id) {
      if (depthCache.has(id)) return depthCache.get(id);
      depthCache.set(id, 0);
      var c = cmap.get(id);
      var d = c && c.requires.length ? 1 + Math.max.apply(null, c.requires.map(depth)) : 0;
      depthCache.set(id, d);
      return d;
    }

    // 本が前提とする概念(前提の前提も含む)/ 本で身につく概念(その前提も含む)
    var needCache = new Map(), teachCache = new Map();
    function bookNeed(b) {
      if (!needCache.has(b.id)) needCache.set(b.id, upAll(b.requires));
      return needCache.get(b.id);
    }
    function teachSet(b) {
      if (!teachCache.has(b.id)) teachCache.set(b.id, upAll(b.teaches));
      return teachCache.get(b.id);
    }

    // 難易度帯: 0=入門 1=基礎 2=応用 3=発展
    // 前提概念の数(前提の前提を含む)で決め、先に読む本があればその本より一段上にする
    var levelCache = new Map();
    function levelOf(b) {
      if (levelCache.has(b.id)) return levelCache.get(b.id);
      levelCache.set(b.id, 0);
      var n = bookNeed(b).size;
      var lv = n === 0 ? 0 : n <= 3 ? 1 : n <= 7 ? 2 : 3;
      (b.book_requires || []).forEach(function (t) {
        var p = byTitle.get(t);
        if (p) lv = Math.max(lv, Math.min(3, levelOf(p) + 1));
      });
      levelCache.set(b.id, lv);
      return lv;
    }

    // 受けた授業から、いま持っている概念を求める
    function knownState(S) {
      var courseSet = new Set(S.courses);
      var direct = new Set();
      courses.forEach(function (co) {
        if (courseSet.has(co.id)) co.teaches.forEach(function (t) { direct.add(t); });
      });
      return { known: upAll(direct) };
    }

    function bookInfo(b, ks) {
      var need = Array.from(bookNeed(b)).sort(function (a, c) { return depth(a) - depth(c); });
      var missing = need.filter(function (id) { return !ks.known.has(id); });
      var unmet = (b.book_requires || []).filter(function (t) { return byTitle.has(t); });
      var gap = missing.length + unmet.length;
      return {
        need: need, missing: missing, unmet: unmet, gap: gap,
        status: gap === 0 ? 'ready' : gap <= 2 ? 'near' : 'prep',
        level: levelOf(b)
      };
    }

    function coursesFor(conceptId) {
      return courses.filter(function (c) { return c.teaches.indexOf(conceptId) >= 0; })
        .map(function (c) { return c.name; });
    }

    // 目標の本までの読書ルート(足りない概念を、授業・自習・先に読む本で埋める順番)
    function route(target, ks) {
      var known = new Set(ks.known);
      var order = [];
      var selfMap = new Map();
      var seen = new Set([target.id]);

      function visit(b) {
        (b.book_requires || []).forEach(function (t) {
          var p = byTitle.get(t);
          if (p && !seen.has(p.id)) {
            seen.add(p.id);
            visit(p);
            order.push(p);
            teachSet(p).forEach(function (x) { known.add(x); });
          }
        });
        var need = Array.from(bookNeed(b)).sort(function (a, c) { return depth(a) - depth(c); });
        need.forEach(function (m) {
          if (known.has(m)) return;
          var cands = books.filter(function (p) {
            return !seen.has(p.id) && levelOf(p) < levelOf(b) && p.teaches.indexOf(m) >= 0;
          }).sort(function (x, y) { return levelOf(x) - levelOf(y) || x.title.localeCompare(y.title); });
          if (cands.length) {
            var p = cands[0];
            seen.add(p.id);
            visit(p);
            order.push(p);
            teachSet(p).forEach(function (x) { known.add(x); });
          } else if (!selfMap.has(m)) {
            selfMap.set(m, coursesFor(m));
          }
        });
      }
      visit(target);
      var selfStudy = [];
      selfMap.forEach(function (cs, id) { selfStudy.push({ id: id, courses: cs }); });
      selfStudy.sort(function (a, c) { return depth(a.id) - depth(c.id); });
      return { books: order, selfStudy: selfStudy };
    }

    // ---- おすすめ ----
    var CONF = { high: 1, medium: 0.5, low: 0 };
    function fresh(b, ks) { return b.teaches.filter(function (t) { return !ks.known.has(t); }); }

    // 同じ分野に偏らないように、点数から「すでに選んだ同分野の本」ぶんを引いて1冊ずつ選ぶ
    function pick(cands, n) {
      var chosen = [], perCat = {};
      var pool = cands.slice();
      while (chosen.length < n && pool.length) {
        var best = -1, bestScore = -Infinity;
        for (var i = 0; i < pool.length; i++) {
          var s = pool[i].score - 2 * (perCat[pool[i].b.category] || 0);
          if (s > bestScore) { bestScore = s; best = i; }
        }
        var it = pool.splice(best, 1)[0];
        perCat[it.b.category] = (perCat[it.b.category] || 0) + 1;
        chosen.push(it);
      }
      return chosen;
    }

    /* 今すぐ読める本のうち、新しく学べることが多く、少し背伸びになる本を fit に、
       足りない前提が1〜2件で届く本を next に返す。分野(cat)で絞れる。 */
    function recommend(ks, cat) {
      var rows = books.filter(function (b) { return !cat || cat === 'all' || b.category === cat; })
        .map(function (b) {
          var info = bookInfo(b, ks), fr = fresh(b, ks);
          return { b: b, info: info, fresh: fr, score: fr.length * 2 + info.level * 1.5 + CONF[b.confidence] };
        })
        .filter(function (r) { return r.fresh.length > 0; })
        .sort(function (x, y) { return y.score - x.score || x.b.title.localeCompare(y.b.title); });
      var fit = pick(rows.filter(function (r) { return r.info.status === 'ready'; }), 3);
      var next = pick(rows.filter(function (r) { return r.info.status === 'near'; })
        .map(function (r) { return Object.assign({}, r, { score: r.score - r.info.gap * 1.5 }); }), 2);
      return { fit: fit, next: next };
    }

    return {
      cmap: cmap, bmap: bmap, byTitle: byTitle,
      up: up, upAll: upAll, depth: depth, bookNeed: bookNeed, teachSet: teachSet,
      levelOf: levelOf, knownState: knownState, bookInfo: bookInfo, route: route,
      coursesFor: coursesFor, recommend: recommend
    };
  }

  var api = { build: build };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.LV = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* レベル合わせるぞい: 画面
   画面は4つ: 授業(home) / おすすめ(recommend) / 本棚(shelf) / 本の詳細(book-○)。
   URLの # で切り替えるので、ブラウザの戻る・進むがそのまま使える。 */
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('lv-data').textContent);
  var L = LV.build(D);
  var app = document.getElementById('app');
  var KEY = 'lvl-awase-v3';
  var LEVELS = ['入門', '基礎', '応用', '発展'];
  var LEVEL_NOTE = [
    '前提になる知識がなくても読めます',
    '前提になる知識が1〜3個',
    '前提になる知識が4〜7個',
    '前提になる知識が8個以上、または別の本の続き'
  ];
  var STAGES = [
    { label: 'これから', year: 0 },
    { label: '1年まで', year: 1 },
    { label: '2年まで', year: 2 },
    { label: '3年まで', year: 3 }
  ];
  var validCourse = new Set(D.courses.map(function (c) { return c.id; }));

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cn(id) { return L.cmap.get(id).name.split(/[（(]/)[0]; }
  function idsUpTo(y) { return D.courses.filter(function (c) { return c.year <= y; }).map(function (c) { return c.id; }); }

  // ---- 保存(使えない環境でも動くようにする) ----
  function load() {
    var s = { courses: [], cat: 'all', open: false, saved: false };
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        s.saved = true;
        if (Array.isArray(o.courses)) s.courses = o.courses.filter(function (id) { return validCourse.has(id); });
        if (o.cat === 'all' || D.categories.indexOf(o.cat) >= 0) s.cat = o.cat;
      }
    } catch (e) { /* 保存なしで続ける */ }
    return s;
  }
  function save() {
    S.saved = true;
    try { localStorage.setItem(KEY, JSON.stringify({ courses: S.courses, cat: S.cat })); } catch (e) { /* 無視 */ }
  }
  var S = load();

  function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
  function currentStage() {
    for (var i = 0; i < STAGES.length; i++) if (sameSet(S.courses, idsUpTo(STAGES[i].year))) return i;
    return -1;
  }
  function stageName() {
    var st = currentStage();
    return (st >= 0 ? STAGES[st].label : '自分で選択') + '(' + S.courses.length + '科目)';
  }

  // ---- 画面の行き来 ----
  var cur, lastList = 'recommend', fromApp = false, scrolls = {};
  function parse(h) {
    var s = String(h || '').replace(/^#/, '');
    if (s === 'home' || s === 'recommend' || s === 'shelf') return s;
    if (/^book-/.test(s) && L.bmap.has(s.slice(5))) return s;
    return null;
  }
  function go(r) {
    if (r === cur) return;
    scrolls[cur] = window.scrollY;
    cur = r;
    try { location.hash = r; } catch (e) { /* 履歴に残せなくても画面は切り替える */ }
    fromApp = location.hash === '#' + r;
    show(true);
  }
  function back() {
    if (fromApp) { try { history.back(); return; } catch (e) { /* 下で戻る */ } }
    go(lastList);
  }
  window.addEventListener('hashchange', function () {
    var n = parse(location.hash) || 'home';
    if (n === cur) return;
    scrolls[cur] = window.scrollY;
    cur = n;
    show(false);
  });
  function show(forward) {
    render(true);
    window.scrollTo(0, forward ? 0 : (scrolls[cur] || 0));
  }

  // ---- 部品 ----
  function statusText(info) {
    if (info.status === 'ready') return 'いま読めます';
    if (info.status === 'near') return 'あと' + info.gap + '件で読めます';
    return '前提があと' + info.gap + '件';
  }
  function whyFit(r) {
    var names = r.fresh.slice(0, 2).map(cn).join('、');
    var more = r.fresh.length > 2 ? ' ほか' + (r.fresh.length - 2) + '件' : '';
    return '前提はそろっています。新しく学べること: ' + names + more;
  }
  function whyNext(r) {
    var parts = r.info.missing.map(function (id) {
      var cs = L.coursesFor(id);
      return cn(id) + (cs.length ? '(' + cs[0] + 'で学べます)' : '(自習)');
    }).concat(r.info.unmet.map(function (t) { return '先に『' + t + '』を読む'; }));
    return 'あと' + r.info.gap + '件で読めます。足りない知識: ' + parts.join('、');
  }
  function recHtml(r, why) {
    var b = r.b;
    return '<button class="rec" data-book="' + b.id + '" data-k="rc-' + b.id + '">' +
      '<span class="mini s-' + r.info.status + '" aria-hidden="true"><span>' + LEVELS[r.info.level] + '</span></span>' +
      '<span class="rec-body"><span class="rec-title">' + esc(b.title) + '</span>' +
      '<span class="rec-meta">' + esc(b.category) + '・' + LEVELS[r.info.level] + (b.author ? '・' + esc(b.author) : '') + '</span>' +
      '<span class="rec-why">' + esc(why(r)) + '</span></span></button>';
  }
  function nowLine() {
    return '<p class="now"><span>いまの選択: <b>' + esc(stageName()) + '</b></span>' +
      '<button class="link" data-go="home" data-k="chg">授業を変える</button></p>';
  }
  function catsHtml() {
    var h = '<div class="cats" role="group" aria-label="分野">';
    ['all'].concat(D.categories).forEach(function (c, i) {
      var n = c === 'all' ? D.books.length : D.books.filter(function (b) { return b.category === c; }).length;
      h += '<button data-cat="' + esc(c) + '" data-k="ct-' + i + '" aria-pressed="' + (S.cat === c) + '">' +
        (c === 'all' ? 'すべて' : esc(c)) + '<i>' + n + '</i></button>';
    });
    return h + '</div>';
  }
  function barHtml() {
    var tab = cur.indexOf('book-') === 0 ? lastList : cur;
    var tabs = [['home', '授業'], ['recommend', 'おすすめ'], ['shelf', '本棚']];
    return '<div class="bar"><div class="wrap bar-in">' +
      (cur === 'home' ? '<span></span>' : '<button class="brand" data-go="home" data-k="brand">レベル合わせるぞい</button>') +
      '<nav class="tabs" aria-label="画面の切り替え">' + tabs.map(function (t) {
        return '<button data-go="' + t[0] + '" data-k="tab-' + t[0] + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + '</button>';
      }).join('') + '</nav></div></div>';
  }

  // ---- 画面1: 授業 ----
  function homeHtml() {
    var stage = currentStage();
    var h = '<header class="wrap mast"><h1 class="ttl" id="ttl" tabindex="-1">レベル合わせるぞい</h1>' +
      '<p>受けた授業から、いまのあなたに合う武蔵野大学6階の技術書を探します。</p></header>';
    h += '<main><section class="wrap block" aria-labelledby="h-stage"><h2 id="h-stage">どこまで授業を受けましたか</h2>' +
      '<p class="lead">近いものを1つ選んで、下のボタンを押してください。</p><div class="stairs">';
    STAGES.forEach(function (st, i) {
      var cls = 'step' + (stage === i ? ' on' : stage > i ? ' done' : '');
      h += '<button class="' + cls + '" data-stage="' + i + '" data-k="st' + i + '" aria-pressed="' + (stage === i) + '">' +
        '<b>' + st.label + '</b><small>' + idsUpTo(st.year).length + '科目</small></button>';
    });
    h += '</div>';
    h += '<button class="link" data-act="toggle" data-k="tg" aria-expanded="' + S.open + '">' +
      (S.open ? '授業の選択を閉じる' : '授業を1つずつ選ぶ') + '(いま' + S.courses.length + '科目)</button>';
    if (S.open) {
      h += '<div class="years">';
      [1, 2, 3].forEach(function (y) {
        var cs = D.courses.filter(function (c) { return c.year === y; });
        if (!cs.length) return;
        h += '<div><h3>' + y + '年次</h3><div class="tags">';
        cs.forEach(function (c) {
          h += '<button class="course" data-course="' + c.id + '" data-k="co-' + c.id + '" aria-pressed="' + (S.courses.indexOf(c.id) >= 0) + '">' + esc(c.name) + '</button>';
        });
        h += '</div></div>';
      });
      h += '</div>';
    }
    h += '<button class="go" data-go="recommend" data-k="go">この内容でおすすめを見る</button></section></main>';
    h += '<div class="wrap about"><details><summary>このサイトのしくみ</summary><div class="about-in">' +
      '<p>本ごとに「読む前に必要な知識」をAIが推定しています。必要な知識の数で、入門(0個)・基礎(1〜3個)・応用(4〜7個)・発展(8個以上、または別の本の続き)に分けています。</p>' +
      '<p>背表紙の色は、選んだ授業で身につく知識と比べて決めます。足りない知識が0個なら緑、1〜2個なら黄、3個以上なら灰色です。</p>' +
      '<p>「あなたに合う本」は、緑の本から新しく学べることが多く少し背伸びになる本を3冊まで選びます。黄色の本からは、足りない知識が少ない順に2冊まで出します。</p>' +
      '<p>選んだ授業と分野は、このブラウザの中にだけ保存されます。外部には送りません。</p>' +
      '<p>知識のタグはAIによる推定で、人の確認はまだです。実際の内容は、本を手に取って確かめてください。</p>' +
      '<button class="btn" data-act="reset" data-k="rs">保存した選択を消す</button></div></details></div>';
    h += '<footer><div class="wrap">武蔵野大学6階の技術書を、前提知識の近さで並べています。書名・著者・出版社・要旨のみを載せ、本文は載せていません。</div></footer>';
    return h;
  }

  // ---- 画面2: おすすめ ----
  function recommendHtml(ks) {
    var rec = L.recommend(ks, S.cat);
    var h = '<div class="wrap page"><div><h1 class="page-h ttl" id="ttl" tabindex="-1">あなたに合う本</h1>' + nowLine() + '</div>' + catsHtml();
    h += '<section class="block"><div class="recs-head"><h2>いま読む本</h2><p class="lead">前提がそろっていて、新しく学べることが多い順に、分野が偏らないよう選んでいます。</p></div>';
    h += rec.fit.length
      ? '<div class="recs">' + rec.fit.map(function (r) { return recHtml(r, whyFit); }).join('') + '</div>'
      : '<p class="empty">この条件で、いま読める本は見つかりませんでした。分野を「すべて」にするか、授業を増やしてみてください。</p>';
    h += '</section><section class="block"><div class="recs-head"><h2>あと少しで読める本</h2><p class="lead">足りない知識が1〜2件で届く本です。</p></div>';
    h += rec.next.length
      ? '<div class="recs">' + rec.next.map(function (r) { return recHtml(r, whyNext); }).join('') + '</div>'
      : '<p class="empty">あと少しで読める本は、いまのところありません。</p>';
    h += '</section><button class="go alt" data-go="shelf" data-k="to-shelf">6階の本棚で全部見る</button></div>';
    return h;
  }

  // ---- 画面3: 本棚 ----
  function shelfHtml(ks) {
    var books = D.books.filter(function (b) { return S.cat === 'all' || b.category === S.cat; });
    var infos = new Map();
    D.books.forEach(function (b) { infos.set(b.id, L.bookInfo(b, ks)); });
    var readyN = books.filter(function (b) { return infos.get(b.id).status === 'ready'; }).length;
    var h = '<section class="cabinet"><div class="wrap">' +
      '<div class="block"><h1 class="page-h ttl" id="ttl" tabindex="-1">6階の本棚</h1>' + nowLine() +
      '<p class="lead">棚の段が難しさ、背表紙の色があなたとの距離です。' + (S.cat === 'all' ? '全' : esc(S.cat) + 'の') +
      books.length + '冊のうち、いま読める本は' + readyN + '冊。本を選ぶと詳しく見られます。</p></div>' + catsHtml() +
      '<div class="legend"><span><i class="s-ready"></i>いま読める</span><span><i class="s-near"></i>あと1〜2件の知識で読める</span><span><i class="s-prep"></i>前提がまだ多い</span></div>';
    LEVELS.forEach(function (name, lv) {
      var row = books.filter(function (b) { return infos.get(b.id).level === lv; })
        .sort(function (a, b) {
          return D.categories.indexOf(a.category) - D.categories.indexOf(b.category) || a.short.localeCompare(b.short, 'ja');
        });
      if (!row.length) return;
      h += '<div class="shelf"><div class="shelf-head"><h2>' + name + '</h2><p>' + LEVEL_NOTE[lv] + '(' + row.length + '冊)</p></div><div class="rack">';
      row.forEach(function (b) {
        var info = infos.get(b.id);
        h += '<button class="spine s-' + info.status + '" data-book="' + b.id + '" data-k="bk-' + b.id + '" title="' + esc(b.title) + '" ' +
          'aria-label="' + esc(b.title) + '、' + name + '、' + statusText(info) + '"><span>' + esc(b.short) + '</span></button>';
      });
      h += '</div></div>';
    });
    return h + '<button class="go alt" data-go="recommend" data-k="to-rec">あなたに合う本を見る</button></div></section>';
  }

  // ---- 画面4: 本の詳細 ----
  function detailHtml(id, ks) {
    var b = L.bmap.get(id), info = L.bookInfo(b, ks);
    var h = '<div class="wrap page detail"><button class="link" data-act="back" data-k="back">' + (lastList === 'shelf' ? '本棚にもどる' : 'おすすめにもどる') + '</button>';
    h += '<div class="detail-head"><span class="mini s-' + info.status + '" aria-hidden="true"><span>' + LEVELS[info.level] + '</span></span><div>' +
      '<h1 class="ttl" id="ttl" tabindex="-1">' + esc(b.title) + '</h1>' +
      '<p class="by">' + [b.author, b.publisher, b.year ? b.year + '年' : null].filter(Boolean).map(esc).join(' / ') + '</p></div></div>';
    h += '<div class="chips-row"><span class="chip">' + LEVELS[info.level] + '</span><span class="chip s-' + info.status + '">' + statusText(info) + '</span></div>';
    h += '<section><h3>想定している読者</h3><p>' + esc(b.audience) + '</p></section>';
    h += '<section><h3>この本で学べること</h3><div class="concepts">' + b.teaches.map(function (t) { return '<span>' + esc(cn(t)) + '</span>'; }).join('') + '</div></section>';
    h += '<section><h3>先に必要な知識</h3>';
    if (info.gap === 0) {
      h += '<p class="ok-line">' + (info.need.length ? '選んだ授業で、前提はそろっています。' : '前提になる知識は要りません。') + '</p>';
    } else {
      h += '<div class="concepts">' + info.missing.map(function (m) { return '<span>' + esc(cn(m)) + '</span>'; }).join('') +
        info.unmet.map(function (t) { return '<span>『' + esc(t) + '』</span>'; }).join('') + '</div>';
    }
    h += '</section>';
    if (info.gap > 0) {
      var r = L.route(b, ks);
      h += '<section><h3>おすすめの順番</h3><ol class="steps">';
      r.selfStudy.forEach(function (s) {
        h += '<li><span class="k">' + (s.courses.length ? '授業・自習' : '自習') + '</span><span>' + esc(cn(s.id)) +
          (s.courses.length ? '<br><span class="small">' + s.courses.slice(0, 2).map(function (c) { return '「' + esc(c) + '」'; }).join('') + 'で学べます</span>' : '') + '</span></li>';
      });
      r.books.forEach(function (p) {
        h += '<li><span class="k">先に読む</span><span><button class="link inline" data-book="' + p.id + '">『' + esc(p.title) + '』</button></span></li>';
      });
      h += '<li class="goal"><span class="k">めざす本</span><span><b>' + esc(b.title) + '</b></span></li></ol></section>';
    }
    var conf = { high: '高', medium: '中', low: '低' }[b.confidence] || '中';
    return h + '<p class="small">この本の前提知識の推定の確かさ: ' + conf + '。AIによる推定で、人の確認はまだです。</p></div>';
  }

  // ---- 描画 ----
  function render(changed) {
    if (cur === 'recommend' || cur === 'shelf') lastList = cur;
    var ks = L.knownState(S);
    var focusKey = !changed && document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    var body = cur === 'home' ? homeHtml()
      : cur === 'recommend' ? recommendHtml(ks)
      : cur === 'shelf' ? shelfHtml(ks)
      : detailHtml(cur.slice(5), ks);
    app.innerHTML = barHtml() + '<div id="screen">' + body + '</div>';
    var screen = document.getElementById('screen');
    if (changed) {
      screen.classList.add('enter');
      var t = document.getElementById('ttl');
      if (t) t.focus({ preventScroll: true });
    } else if (focusKey) {
      var els = app.querySelectorAll('[data-k]');
      for (var i = 0; i < els.length; i++) if (els[i].dataset.k === focusKey) { els[i].focus({ preventScroll: true }); break; }
    }
  }

  // ---- 操作 ----
  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    var d = t.dataset;
    if (d.go) {
      go(d.go);
    } else if (d.book) {
      go('book-' + d.book);
    } else if (d.act === 'back') {
      back();
    } else if (d.stage !== undefined) {
      S.courses = idsUpTo(STAGES[+d.stage].year);
      save(); render(false);
    } else if (d.course) {
      var i = S.courses.indexOf(d.course);
      if (i >= 0) S.courses.splice(i, 1); else S.courses.push(d.course);
      save(); render(false);
    } else if (d.cat !== undefined) {
      S.cat = d.cat; save(); render(false);
    } else if (d.act === 'toggle') {
      S.open = !S.open; render(false);
    } else if (d.act === 'reset') {
      S = { courses: [], cat: 'all', open: false, saved: false };
      try { localStorage.removeItem(KEY); } catch (err) { /* 無視 */ }
      render(false);
    }
  });

  // 最初の画面: 前回の続きがあればおすすめから、なければ授業の選択から
  cur = parse(location.hash);
  if (!cur) {
    cur = S.saved ? 'recommend' : 'home';
    if (cur !== 'home') { try { history.replaceState(null, '', '#' + cur); } catch (e) { /* 無視 */ } }
  }
  render(false);
  window.scrollTo(0, 0);
})();

</script>
